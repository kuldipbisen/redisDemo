version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: redis_demo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: redis_demo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis_demo_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
